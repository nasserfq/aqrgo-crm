<div class="topbar-wrap">
<header class="topbar">

  <nav>
    <span class="nav-section" aria-hidden="true">المكتب</span>
    <a href="/" {% if nav == common::ui::Nav::Listings %}class="active" aria-current="page"{% endif %}><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2.5"/><path d="M3 8.5h14M8 8.5V16"/></svg>العروض</a>

    <span class="who-avatar" aria-hidden="true">{{ user.name.chars().next().unwrap_or('A') }}</span>
