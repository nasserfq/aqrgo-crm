<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>رمز الدخول</title>
</head>
<body dir="rtl" style="margin:0;padding:0;background:#f7f5fc;font-family:Tahoma,'Segoe UI',Arial,sans-serif;color:#1b1530">
<div style="display:none;max-height:0;overflow:hidden">رمز الدخول إلى AQRGO: {{ code }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f7f5fc">
<tr><td align="center" style="padding:32px 16px">
  <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" dir="rtl" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #e4def3;border-radius:4px">
    <tr><td style="padding:0;font-size:0;line-height:0"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="40" height="6" style="background:#1b1530;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#34237a;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#34237a;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#4f37b0;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#4f37b0;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#6c4fd8;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#6c4fd8;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#8a68e4;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#8a68e4;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#a68bef;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#a68bef;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#c3b1f6;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#c3b1f6;font-size:0;line-height:0">&nbsp;</td><td width="40" height="6" style="background:#ddd2fb;font-size:0;line-height:0">&nbsp;</td></tr></table></td></tr>
    <tr><td align="right" style="padding:28px 32px 8px">
      <a href="{{ public_url }}" style="text-decoration:none"><img src="{{ public_url }}/static/logo.png" width="152" height="42" alt="AQRGO" style="display:block;border:0;width:152px;height:42px"></a>
    </td></tr>
    <tr><td align="right" style="padding:16px 32px 0;font-size:22px;font-weight:bold;line-height:1.4;color:#1b1530">رمز الدخول إلى حسابك</td></tr>
    <tr><td align="right" style="padding:8px 32px 0;font-size:15px;line-height:1.7;color:#6d6585">اكتب هذا الرمز في صفحة الدخول. صالح لمدة {{ minutes }} دقائق ولمرة واحدة.</td></tr>
    <tr><td align="center" style="padding:24px 32px">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
        <td align="center" dir="ltr" style="background:#efeafd;border-radius:4px;padding:18px 12px;font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:bold;letter-spacing:10px;color:#3d2a8a">{{ code }}</td>
      </tr></table>
    </td></tr>
    <tr><td align="right" style="padding:0 32px 28px">
      <a href="{{ public_url }}/login" style="display:inline-block;background:#1b1530;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 22px;border-radius:4px">افتح صفحة الدخول</a>
    </td></tr>
    <tr><td align="right" style="padding:18px 32px 24px;border-top:1px solid #e4def3;font-size:13px;line-height:1.7;color:#6d6585">إذا لم تطلب هذا الرمز فتجاهل الرسالة، ولن يتغير شيء في حسابك. لا تشارك الرمز مع أحد.</td></tr>
  </table>
  <p dir="ltr" style="margin:16px 0 0;font-size:12px;color:#8f88a8;font-family:Arial,sans-serif">Your AQRGO CRM sign-in code is {{ code }}</p>
</td></tr>
</table>
</body>
</html>
