name: Diagnose accounts (temporary)

# Temporary, read-only: which account each chat is linked to and how many
# listings each account owns. The repo is public, so it prints only ids,
# counts, dates and whether an email matches a given SHA-256 hash; never an
# email, a phone number or a listing's text.
on:
  push:
    branches: [claude/project-thread-bosqsw]
    paths: [.github/workflows/diagnose-accounts.yml]

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/aqrgo-crm' }}
          TARGET: 85611214102fa2a109ebc2d7a40c3c37b92891e0dba83cf6a0eaa908b4c09fec
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_DIR,TARGET
          script: |
            cd "$DEPLOY_DIR"
            docker compose exec -T db psql -U crm crm -v ON_ERROR_STOP=1 -v target="$TARGET" <<'SQL'
            BEGIN READ ONLY;
            SELECT u.id,
                   split_part(u.email, '@', 2) AS domain,
                   encode(sha256(convert_to(u.email, 'UTF8')), 'hex') = :'target' AS exact_nafa,
                   encode(sha256(convert_to(replace(split_part(split_part(u.email, '@', 1), '+', 1), '.', '') || '@' || split_part(u.email, '@', 2), 'UTF8')), 'hex') = :'target' AS nafa_ignoring_dots_plus,
                   u.email LIKE 'nafa%' AS starts_nafa,
                   encode(sha256(convert_to(u.email, 'UTF8')), 'hex') = 'a035123d405e1060e157e07a36fd674ac90a055b07c30e6ac3fac07d90dd7ab4' AS is_nonq,
                   u.whatsapp_id IS NOT NULL AS whatsapp,
                   u.telegram_id IS NOT NULL AS telegram
              FROM auth.users u ORDER BY u.id;
            ROLLBACK;
            SQL
