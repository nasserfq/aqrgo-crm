name: Desktop apps

# The Mac, Windows and Linux apps (Tauri, in desktop/). Pull requests build
# all three and attach them to the run; main publishes a GitHub release
# named after the version in desktop/src-tauri/tauri.conf.json.
on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: desktop

      # Signing turns on by itself once these GitHub secrets exist (see desktop/README.md).
      - name: Mac signing and notarization
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Signing with $IDENTITY"
          else
            echo "No Developer ID certificate yet: the app is ad-hoc signed."
          fi
          if [ -n "$CERT" ] && [ -n "$API_KEY_P8" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
            echo "Notarizing with the App Store Connect API key"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          # Only main publishes; pull requests just build.
          tagName: ${{ github.event_name != 'pull_request' && 'desktop-v__VERSION__' || '' }}
          releaseName: AQRGO Desktop __VERSION__
          releaseBody: |
            تطبيق AQRGO لسطح المكتب.
            - Mac: ملف ‎.dmg
            - Windows: ملف ‎-setup.exe
            - Linux: ملف ‎.AppImage أو ‎.deb
          releaseDraft: false
          prerelease: false

      # tauri-action notarizes the app inside the DMG but not the DMG itself, so
      # Gatekeeper calls the download "Unnotarized". Notarize and staple it too,
      # then replace the copy in the release.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
            gh release upload "desktop-v$version" "$dmg" --clobber
          fi

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aqrgo-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          retention-days: 14

  # The Mac App Store version: same app, sandboxed, no private window APIs,
  # signed for the store and packaged as a .pkg. It is the macOS version of
  # the App Store app com.aqrgo.app (one listing with the iPhone app). Pull
  # requests build it; main uploads it to App Store Connect.
  appstore:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: appstore
      - run: npm ci
        working-directory: desktop

      - name: Store certificates and profile
        id: certs
        env:
          CERTS: ${{ secrets.APPLE_MAS_CERTIFICATES }}
          CERTS_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATES_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_MAS_PROFILE }}
        run: |
          if [ -z "$CERTS" ] || [ -z "$PROFILE" ]; then
            echo "No Mac App Store certificates yet: skipping the store build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/mas.keychain-db"
          kc_password=$(openssl rand -hex 16)
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          printf '%s' "$CERTS" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -k "$keychain" -P "$CERTS_PASSWORD" -A -t cert -f pkcs12
          rm "$RUNNER_TEMP/mas.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$kc_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$PROFILE" | base64 --decode > desktop/src-tauri/AQRGO_MAS.provisionprofile
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build for the Mac App Store
        if: steps.certs.outputs.ready == 'true'
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_MAS_APP_IDENTITY }}
        run: |
          # Each upload needs a new build number.
          echo "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"${{ github.run_number }}\"}}}" > "$RUNNER_TEMP/build-number.json"
          npm run tauri build -- --target universal-apple-darwin --bundles app \
            --config src-tauri/tauri.appstore.conf.json --config "$RUNNER_TEMP/build-number.json" \
            -- --features appstore
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/AQRGO.app
          codesign -d --entitlements - "$app" | grep -q app-sandbox
          ! nm -u "$app/Contents/MacOS/aqrgo-desktop" | grep -q _setDrawsBackground
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleVersion|CFBundleShortVersionString|LSMinimumSystemVersion'

      - name: Package
        if: steps.certs.outputs.ready == 'true'
        working-directory: desktop
        env:
          INSTALLER_IDENTITY: ${{ secrets.APPLE_MAS_INSTALLER_IDENTITY }}
        run: |
          xcrun productbuild --component src-tauri/target/universal-apple-darwin/release/bundle/macos/AQRGO.app /Applications \
            --sign "$INSTALLER_IDENTITY" AQRGO.pkg
          pkgutil --check-signature AQRGO.pkg

      - name: Upload to App Store Connect
        if: steps.certs.outputs.ready == 'true' && github.event_name != 'pull_request'
        working-directory: desktop
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app --type macos --file AQRGO.pkg --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"

      - if: steps.certs.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aqrgo-desktop-mac-app-store
          path: desktop/AQRGO.pkg
          retention-days: 14
