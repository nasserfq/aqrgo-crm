name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  e2e:
    # Drives the real app in Chromium at desktop and phone sizes.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p app --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/test-results
            e2e/server.log
          retention-days: 7

  build:
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/aqrgo-crm' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN || 'aqrgo.com' }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/.env.example"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1
      - name: Pull the new image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_DIR,APP_DOMAIN,IMAGE,AWS_BEARER_TOKEN_BEDROCK,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,TELEGRAM_BOT_TOKEN,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,TYPESAFE_API_KEY,SENTRY_DSN,SENTRY_RELEASE
          script: |
            set -e
            cd "$DEPLOY_DIR"
            if [ ! -f .env ]; then
              # First deploy: start from the template and generate the local secrets.
              cp .env.example .env
              sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
              sed -i "s|^TELEGRAM_WEBHOOK_SECRET=.*|TELEGRAM_WEBHOOK_SECRET=$(openssl rand -hex 24)|" .env
              echo "Created $DEPLOY_DIR/.env from .env.example"
            fi
            chmod 600 .env
            # The public address is set here so changing it needs no server edits.
            DOMAIN="$APP_DOMAIN"; PUBLIC_URL="https://$APP_DOMAIN"
            # Secrets kept in GitHub are written into .env so they never live in the repo.
            for name in DOMAIN PUBLIC_URL AWS_BEARER_TOKEN_BEDROCK AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TELEGRAM_BOT_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET TYPESAFE_API_KEY SENTRY_DSN SENTRY_RELEASE; do
              value="${!name}"
              [ -n "$value" ] || continue
              grep -v "^$name=" .env > .env.new || true
              printf '%s=%s\n' "$name" "$value" >> .env.new
              chmod 600 .env.new && mv .env.new .env
            done
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Remember the deployed image so a manual `docker compose up` uses it too.
            if grep -q '^APP_IMAGE=' .env; then sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|" .env; else echo "APP_IMAGE=$IMAGE" >> .env; fi
            export APP_IMAGE="$IMAGE"
            docker compose pull app
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            healthy=""
            for i in $(seq 1 30); do
              if docker compose exec -T app curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
                healthy=1; break
              fi
              sleep 2
            done
            if [ -z "$healthy" ]; then docker compose logs --tail 80 app; exit 1; fi
            # Route the domain and www (with HTTPS) to the app through the shared kamal-proxy.
            docker exec kamal-proxy kamal-proxy deploy aqrgo-crm \
              --target aqrgo-crm-app:8080 --host "$APP_DOMAIN" --host "www.$APP_DOMAIN" --tls \
              --health-check-path /healthz
            echo "Deployed $IMAGE"
