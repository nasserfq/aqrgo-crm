[package]
name = "aqrgo-desktop"
version = "1.1.3"
description = "AQRGO CRM for Mac, Windows and Linux"
edition = "2021"
publish = false

# Its own workspace: the server's `cargo test --workspace` stays free of
# desktop system libraries (WebKitGTK and the like).
[workspace]

[lib]
name = "aqrgo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `appstore` builds the Mac App Store version: no private window APIs (Apple
# rejects them), so no see-through sidebar. See tauri.appstore.conf.json.
[features]
appstore = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
url = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
