[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["form", "macros"] }
askama = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
teloxide-core = { version = "0.13", default-features = false, features = ["rustls"] }
icu_calendar = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["trace"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sesv2 = "1"
aws-sdk-bedrockruntime = "1"
aws-smithy-types = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
async-trait = "0.1"
common = { path = "crates/common" }
jobs = { path = "crates/jobs" }
mailer = { path = "crates/mailer" }
testkit = { path = "crates/testkit" }
ai = { path = "crates/ai" }
listings = { path = "crates/listings" }
auth = { path = "crates/auth" }
telegram = { path = "crates/telegram" }
