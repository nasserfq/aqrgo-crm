# Runs on the server. GitHub Actions copies this folder to the deploy
# directory and runs `docker compose pull && docker compose up -d`.
# HTTPS is handled by the server's existing kamal-proxy (shared with other
# apps): the app joins the `kamal` network and the deploy registers
# aqrgo.com and www.aqrgo.com with it.
services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
    depends_on:
      db:
        condition: service_healthy
    expose: ["8080"]
    networks:
      default:
      kamal:
        aliases: [aqrgo-crm-app]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Daily pg_dump into ./backups, keeping the last 14 days.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/crm-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U crm crm | gzip > "$$f" && echo "backup written: $$f"
          find /backups -name 'crm-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:

networks:
  kamal:
    external: true
